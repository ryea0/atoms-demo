# Atoms-Demo 反代：SSE 直通（rules/06）+ basic auth 防刷 LLM 账单
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # demo 访问口令（server-bootstrap.sh 生成；重置：htpasswd -bB /etc/nginx/.atoms_htpasswd atoms <新密码>）
    auth_basic "Atoms Demo";
    auth_basic_user_file /etc/nginx/.atoms_htpasswd;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';

        # SSE 关键：关缓冲 + 长读超时，否则"卡住不出字"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
